<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QR.Gen</title>
    <meta name="description" content="Genera códigos QR a partir de una URL directamente en el navegador." />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="card">
      <h1 class="card__title">Generador de QR</h1>

      <form class="form" id="form" novalidate>
        <div class="controls">
          <label class="label" for="url">URL</label>
          <input
            class="input"
            id="url"
            name="url"
            type="text"
            inputmode="url"
            autocomplete="url"
            spellcheck="false"
            placeholder="https://example.com"
          />
          <p class="error" id="error" role="alert" hidden></p>

          <div class="colors">
            <div class="color">
              <label class="label color__label" for="dark">Módulos</label>
              <input class="color__input" id="dark" type="color" value="#111111" />
            </div>
            <div class="color">
              <label class="label color__label" for="light">Fondo</label>
              <input class="color__input" id="light" type="color" value="#ffffff" />
            </div>
          </div>

          <button class="button" type="submit">Generar QR</button>
        </div>

        <div class="output">
          <div class="output__frame">
            <canvas class="output__canvas" id="canvas" width="512" height="512" hidden></canvas>
          </div>
          <button class="button button--secondary" id="download" type="button" hidden>Descargar JPG</button>
        </div>
      </form>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
