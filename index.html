<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QR.Gen</title>
    <meta name="description" content="Genera códigos QR a partir de una URL directamente en el navegador." />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="card">
      <h1 class="card__title">Generador de QR</h1>

      <form class="form" id="form" novalidate>
        <div class="controls">
          <label class="label" for="url">URL</label>
          <input
            class="input"
            id="url"
            name="url"
            type="text"
            inputmode="url"
            autocomplete="url"
            spellcheck="false"
            placeholder="https://example.com"
          />
          <p class="error" id="error" role="alert" hidden></p>

          <div class="shape">
            <label class="label shape__label" for="shape">Forma de módulos</label>
            <select class="select" id="shape">
              <option value="square">Cuadrados</option>
              <option value="circle">Círculos</option>
            </select>
          </div>

          <div class="colors">
            <div class="color">
              <label class="label color__label" for="dark">Módulos</label>
              <input class="color__input" id="dark" type="color" value="#ededed" />
            </div>
            <div class="color">
              <label class="label color__label" for="light">Fondo</label>
              <input class="color__input" id="light" type="color" value="#0f0f0f" />
            </div>
          </div>

          <div class="logo">
            <label class="label">Imagen central</label>
            <div class="logo__row">
              <img class="logo__preview" id="logo-preview" alt="" hidden />
              <button class="button button--secondary" id="logo-pick" type="button">Subir imagen</button>
              <button class="button button--secondary" id="logo-remove" type="button" hidden>Quitar</button>
            </div>
            <input class="visually-hidden" id="logo-input" type="file" accept="image/*" />
          </div>

          <button class="button" type="submit">Generar QR</button>
        </div>

        <div class="output">
          <div class="output__frame">
            <div class="output__svg" id="svg-host" hidden aria-hidden="true"></div>
            <canvas class="output__canvas" id="canvas" width="512" height="512" hidden></canvas>
          </div>
          <button class="button button--secondary" id="download" type="button" hidden>Descargar JPG</button>
        </div>
      </form>
    </main>

    <div class="modal" id="editor" hidden>
      <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="editor-title">
        <h2 class="modal__title" id="editor-title">Ajustar imagen</h2>
        <p class="modal__hint">Arrastra para encuadrar y usa el zoom para acercar.</p>
        <div class="editor" id="editor-viewport">
          <img class="editor__image" id="editor-image" alt="" draggable="false" />
        </div>
        <div class="editor__zoom">
          <label class="label" for="editor-zoom">Zoom</label>
          <input id="editor-zoom" type="range" min="1" max="4" step="0.01" value="1" />
        </div>
        <div class="modal__actions">
          <button class="button button--secondary" id="editor-cancel" type="button">Cancelar</button>
          <button class="button" id="editor-apply" type="button">Aplicar</button>
        </div>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
